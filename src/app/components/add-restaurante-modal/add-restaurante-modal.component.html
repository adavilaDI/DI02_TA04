<ion-header>
  <ion-toolbar>
    <ion-title>Añadir Restaurante</ion-title>
    <ion-buttons slot="end">
      <!-- TODO - Añadiremos un botón para cancelar y cerrar el Modal-->
       <ion-button (click) = "cancelar()">cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Añadir el [formGroup] y (ngSubmit) para guardar-->
  <form [formGroup] = 'form' (ngSubmit) = 'guardar()'>
    <ion-list lines="full">
      <!-- TODO - Añadir los campos necesarios a cada ion-input-->
      <!-- Nombre -->
      <ion-item>
        <ion-input formControlName = 'documentName' type = 'text'
          placeholder= 'Nombre del restaurante' label= 'Nombre *'
          labelPlacement = 'stacked'>
        </ion-input>
      </ion-item>
      <!-- TODO - documentName debe ser obligatorio y habrá que comprobar si es invalid && touched
                - Mostramos un texto "El nombre es obligatorio" mediante <ion-text><small>  
        -->
      @if (form.get('documentName')?.invalid && form.get('documentName')?.touched) {
        <ion-text color="danger" class="ion-padding-start">
          <small>El nombre es obligatorio</small>
        </ion-text>
      }
      <ion-item>
        <ion-input formControlName = 'territory' type = 'text'
          placeholder= 'Ej: Bizkaia' label= 'Provincia *'
          labelPlacement = 'stacked'>
        </ion-input>
      </ion-item>
      <!-- TODO - territory debe ser obligatorio y habrá que comprobar si es invalid && touched
                - Mostramos un texto "El territorio es obligatorio" mediante <ion-text><small>  
        -->
      @if (form.get('territory')?.invalid && form.get('territory')?.touched) {
        <ion-text color="danger" class="ion-padding-start">
          <small>El territorio es obligatorio</small>
        </ion-text>
      }

      <!-- Localidad -->
      <ion-item>
        <ion-input formControlName = 'locality' type = 'text'
          placeholder= 'Ej: Bilbao' label= 'Localidad'
          labelPlacement = 'stacked'>
        </ion-input>
      </ion-item>

      <!-- Dirección -->
      <ion-item>
        <ion-input formControlName = 'address' type = 'text'
          placeholder= 'Calle y número' label= 'Dirección'
          labelPlacement = 'stacked'>
        </ion-input>
      </ion-item>

      <!-- Teléfono -->
      <ion-item>
        <ion-input
          type="tel"
          formControlName="phone" placeholder='9xxxxxxxx'>
        </ion-input>
      </ion-item>

      <!-- Web -->
      <ion-item>
        <ion-input
          type="url"
          formControlName="web" placeholder='https://...'>
        </ion-input>
      </ion-item>

      <!-- Estrellas Michelin -->
      <ion-item>
        <ion-input
          type="number"
          min="0"
          max="3"
          formControlName="michelinStar" placeholder = '0'>
        </ion-input>
      </ion-item>

      <!-- Soles Repsol -->
      <ion-item>
        <ion-input
          type="number"
          min="0"
          max="3"
          formControlName="repsolSun" placeholder = '0'>
        </ion-input>
      </ion-item>

    </ion-list>

    <!-- TOOD - Se valorará añadir y controlar un spinner y hacer uso de Signals guardando para mostrar un mensaje u otro-->
    <div class="ion-padding-top">
      <ion-button
        (click)="guardar()"
        [disabled]="form.invalid || guardando()"
        title="Subir restaurante a Firebase" expand = 'full'>
        @if (guardando()) {
          <ion-spinner name="crescent" style="width:18px;height:18px;margin-right:6px;"></ion-spinner>
        }
        Guardar en Firebase
      </ion-button>
    </div>

  </form>
</ion-content>
